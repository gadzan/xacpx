name: Publish @ganglion/xacpx-channel-relay

on:
  push:
    tags:
      - "channel-relay-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. channel-relay-v0.1.0-beta.0). Must already exist on the repo.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-channel-relay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Read version and verify tag
        id: meta
        run: |
          VERSION="$(node -p "require('./packages/channel-relay/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG_NAME="${{ inputs.tag }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          EXPECTED="channel-relay-v${VERSION}"
          if [[ "$TAG_NAME" != "$EXPECTED" ]]; then
            echo "::error::tag $TAG_NAME does not match package.json version ($EXPECTED)" >&2
            exit 1
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

  build-platform:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            package: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            package: linux-arm64
          - runner: macos-14
            platform: darwin
            arch: arm64
            package: darwin-arm64
          - runner: macos-14
            platform: darwin
            arch: x64
            package: darwin-x64
            rust_target: x86_64-apple-darwin
            bin_path: target/x86_64-apple-darwin/release/xacpx-rmux-bridge
          - runner: windows-latest
            platform: win32
            arch: x64
            package: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify RMUX sidecar pin (no ../rmux path dep)
        run: |
          if grep -E '\.\./rmux|rmux-sdk\s*=\s*\{[^}]*path\s*=' packages/channel-relay/native/rmux-bridge/Cargo.toml; then
            echo "::error::rmux-bridge must not path-depend on ../rmux" >&2
            exit 1
          fi
          grep -F 'rmux-sdk = "=0.10.0"' packages/channel-relay/native/rmux-bridge/Cargo.toml

      - name: Build release sidecar
        run: |
          if [[ -n "${{ matrix.rust_target }}" ]]; then
            rustup target add "${{ matrix.rust_target }}"
            cargo build --release --target "${{ matrix.rust_target }}" \
              --manifest-path packages/channel-relay/native/rmux-bridge/Cargo.toml
          else
            cargo build --release --manifest-path packages/channel-relay/native/rmux-bridge/Cargo.toml
          fi

      # pack-rmux-bridge-platform.mjs downloads the pinned RMUX
      # (RMUX_VERSION + SHA-256 fixed in scripts/rmux-release.mjs), verifies it,
      # copies bridge + bin/rmux + libexec/rmux/rmux into the package, and runs
      # the REAL `rmux -V` on this native host (must print `rmux 0.10.0`).
      - name: Pack platform package with bundled RMUX
        run: |
          BIN="packages/channel-relay/native/rmux-bridge/${BIN_REL:-target/release}/xacpx-rmux-bridge"
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            BIN="${BIN}.exe"
          fi
          node ./scripts/pack-rmux-bridge-platform.mjs \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --binary "$BIN"
          test -f "platform-packages/xacpx-rmux-bridge-${{ matrix.package }}/checksums.json"
          node -e "const c=require('./platform-packages/xacpx-rmux-bridge-${{ matrix.package }}/checksums.json'); if(!c.sha256) process.exit(1); if(!c.artifacts?.rmux?.sha256) process.exit(1); if(!c.artifacts?.rmuxHelper?.sha256) process.exit(1)"
          test -f "platform-packages/xacpx-rmux-bridge-${{ matrix.package }}/bin/rmux${{ matrix.platform == 'win32' && '.exe' || '' }}"
          test -f "platform-packages/xacpx-rmux-bridge-${{ matrix.package }}/libexec/rmux/rmux${{ matrix.platform == 'win32' && '.exe' || '' }}"
        env:
          BIN_REL: ${{ matrix.bin_path && 'target/x86_64-apple-darwin/release' || 'target/release' }}

      # Build the FINAL publishable artifact on the native runner while file
      # modes are still correct. upload-artifact zips lose POSIX exec bits, so
      # everything downstream (smokes + publish) must consume this exact tgz,
      # never re-copied directories — test what you publish.
      - name: npm pack platform package (final publish artifact)
        run: |
          set -euo pipefail
          PKG_DIR="platform-packages/xacpx-rmux-bridge-${{ matrix.package }}"
          VERSION="$(node -p "require('./packages/channel-relay/package.json').version")"
          (cd "$PKG_DIR" && npm pack)
          TGZ="$PKG_DIR/ganglion-xacpx-rmux-bridge-${{ matrix.package }}-${VERSION}.tgz"
          test -f "$TGZ"
          echo "packed $TGZ"
          if [[ "${{ matrix.platform }}" != "win32" ]]; then
            # The tarball must carry exec bits for bridge + rmux + helper;
            # npm preserves them on install, a raw copy does not.
            tar -tzvf "$TGZ" | grep -E '^-rwxr-xr-x.* (bin/xacpx-rmux-bridge|bin/rmux|libexec/rmux/rmux)$'
          fi

      - name: Upload platform package tarball
        uses: actions/upload-artifact@v4
        with:
          # Single tgz preserves the npm-packed modes; the outer zip the
          # artifact store applies does not touch them.
          name: rmux-bridge-${{ matrix.package }}
          path: platform-packages/xacpx-rmux-bridge-${{ matrix.package }}/*.tgz
          if-no-files-found: error

  # Production-package smoke: NO machine-local RMUX anywhere (no
  # install-rmux-release.sh, no ~/.local/libexec/rmux, no PATH rmux). The only
  # RMUX that can resolve is the one bundled in the packed npm package. The
  # test fabricates a hostile fake rmux at the front of PATH and proves it is
  # never executed while a live create/input/recover/kill cycle runs.
  smoke-platform-package:
    needs: [meta, build-platform]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download linux-x64 platform package tarball
        uses: actions/download-artifact@v4
        with:
          name: rmux-bridge-linux-x64
          path: platform-packages/xacpx-rmux-bridge-linux-x64

      # Test what we publish: install the EXACT tgz the publish job will push.
      # No chmod anywhere — the exec bits must survive npm pack → npm install,
      # exactly as they will for every Linux/macOS user.
      - name: Install platform package from the publish tarball
        run: |
          set -euo pipefail
          TGZ="$(ls platform-packages/xacpx-rmux-bridge-linux-x64/*.tgz | head -1)"
          rm -rf packages/channel-relay/node_modules/@ganglion/xacpx-rmux-bridge-linux-x64
          npm install --prefix packages/channel-relay --no-save --no-audit --no-fund --no-package-lock "$TGZ"
          PKG_DIR="$(find packages/channel-relay/node_modules node_modules -maxdepth 4 -type d -name xacpx-rmux-bridge-linux-x64 2>/dev/null | head -1)"
          echo "installed at: $PKG_DIR"
          test -x "$PKG_DIR/bin/xacpx-rmux-bridge"
          test -x "$PKG_DIR/bin/rmux"
          test -x "$PKG_DIR/libexec/rmux/rmux"

      - name: Assert no machine-local RMUX could mask the bundled one
        run: |
          if command -v rmux >/dev/null 2>&1; then echo "rmux unexpectedly on PATH"; exit 1; fi
          if [[ -e "$HOME/.local/libexec/rmux" ]]; then echo "managed helper unexpectedly present"; exit 1; fi

      - name: Production package hostile smoke (bundled RMUX only)
        env:
          XACPX_RMUX_PLATFORM_PACKAGE: "1"
        run: |
          bun test tests/smoke/relay-rmux-platform-package.test.ts

  # Developer / legacy environment smoke: RMUX from the managed helper
  # ~/.local/libexec/rmux + PATH. This exercises the fallback chain for
  # source checkouts and old installs — it must NOT be the only gate, because
  # it can mask a platform package that forgot to bundle RMUX.
  smoke-legacy:
    needs: [meta, build-platform]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download linux-x64 platform package tarball
        uses: actions/download-artifact@v4
        with:
          name: rmux-bridge-linux-x64
          path: platform-packages/xacpx-rmux-bridge-linux-x64

      # Legacy env must NOT get the bundled RMUX beside the bridge (it would
      # mask the managed-helper fallback this smoke exists to prove), so DO
      # NOT install the whole package — extract only the standalone bridge
      # from the publish tarball into a temp dir.
      - name: Extract standalone bridge from the publish tarball
        run: |
          set -euo pipefail
          TGZ="$(ls platform-packages/xacpx-rmux-bridge-linux-x64/*.tgz | head -1)"
          LEGACY_DIR="$RUNNER_TEMP/xacpx-rmux-legacy"
          rm -rf "$LEGACY_DIR"
          mkdir -p "$LEGACY_DIR"
          tar -xzf "$TGZ" -C "$LEGACY_DIR" package/bin/xacpx-rmux-bridge
          BRIDGE="$LEGACY_DIR/package/bin/xacpx-rmux-bridge"
          test -x "$BRIDGE"
          # Guard: no bundled RMUX may sit next to the standalone bridge.
          test ! -e "$(dirname "$BRIDGE")/rmux"
          test ! -e "$(dirname "$BRIDGE")/rmux-daemon"
          echo "XACPX_RMUX_BRIDGE=$BRIDGE" >> "$GITHUB_ENV"

      - name: Install pinned RMUX 0.10.0 (legacy managed helper)
        run: |
          chmod +x scripts/install-rmux-release.sh
          bash scripts/install-rmux-release.sh
          echo "RMUX_SDK_DAEMON_BINARY=$HOME/.local/libexec/rmux/rmux" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Environment under test: standalone bridge + ~/.local/libexec/rmux 0.10
      # + PATH rmux, with NO bundled RMUX — proves explicit bridge → no beside
      # RMUX → managed-helper fallback still works.
      - name: Run real RMUX smoke matrix (legacy env)
        env:
          XACPX_RMUX_INTEGRATION: "1"
        run: |
          bun test tests/smoke/relay-rmux-terminal.test.ts

  # Windows production-package smoke on the real win32 platform package
  # (bundled bin/rmux.exe + libexec helper), native host. Same hostile PATH
  # fake regression as the Linux package smoke.
  smoke-windows:
    needs: [meta, build-platform]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download win32-x64 platform package tarball
        uses: actions/download-artifact@v4
        with:
          name: rmux-bridge-win32-x64
          path: platform-packages/xacpx-rmux-bridge-win32-x64

      # Same exact-tarball install as smoke-platform-package (no manual
      # copying): the smoke consumes the tgz that will be published.
      - name: Install platform package from the publish tarball
        shell: pwsh
        run: |
          $tgz = Get-ChildItem 'platform-packages/xacpx-rmux-bridge-win32-x64/*.tgz' | Select-Object -First 1
          Remove-Item -Recurse -Force 'packages/channel-relay/node_modules/@ganglion/xacpx-rmux-bridge-win32-x64' -ErrorAction SilentlyContinue
          npm install --prefix packages/channel-relay --no-save --no-audit --no-fund --no-package-lock $tgz.FullName
          $candidates = @(
            'packages/channel-relay/node_modules/@ganglion/xacpx-rmux-bridge-win32-x64',
            'node_modules/@ganglion/xacpx-rmux-bridge-win32-x64'
          )
          $pkgDir = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $pkgDir) { throw 'platform package not installed from tarball' }
          if (-not (Test-Path "$pkgDir/bin/rmux.exe")) { throw 'installed package missing bundled rmux.exe' }
          if (-not (Test-Path "$pkgDir/libexec/rmux/rmux.exe")) { throw 'installed package missing rmux helper' }

      - name: Production package hostile smoke (Windows)
        shell: pwsh
        env:
          XACPX_RMUX_PLATFORM_PACKAGE: "1"
        run: |
          bun test tests/smoke/relay-rmux-platform-package.test.ts

  publish-platforms:
    needs: [meta, build-platform, smoke-platform-package, smoke-legacy, smoke-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rmux-bridge-*
          path: artifacts
          merge-multiple: false

      - name: Publish platform packages (before channel-relay)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NPM_TAG="${{ needs.meta.outputs.npm_tag }}"
          for pkg in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            # Publish the EXACT tarball the smokes tested — never re-copy the
            # directory (artifact zips lose POSIX exec bits, the tgz keeps them).
            tgz="$(ls "artifacts/rmux-bridge-${pkg}/"*.tgz | head -1)"
            echo "Publishing $tgz (@ganglion/xacpx-rmux-bridge-${pkg}@${{ needs.meta.outputs.version }})"
            # Tolerate a re-publish after a partial run: a version already on the
            # registry is expected and should not abort the rest of the pipeline.
            if npm publish "$tgz" --tag "$NPM_TAG" --access public; then
              echo "published ${pkg}"
            elif [[ "$(npm view "@ganglion/xacpx-rmux-bridge-${pkg}"@${{ needs.meta.outputs.version }} version 2>/dev/null || true)" == "${{ needs.meta.outputs.version }}" ]]; then
              echo "already published ${pkg}@${{ needs.meta.outputs.version }}, skipping"
            else
              echo "::error::failed to publish ${pkg}" >&2
              exit 1
            fi
          done

  publish-channel-relay:
    needs: [meta, publish-platforms, smoke-platform-package, smoke-legacy, smoke-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build channel-relay (and relay-protocol + plugin-api types)
        run: bun run build:channel-relay

      - name: Sync rmux-bridge optionalDependencies to channel-relay version
        run: node ./scripts/sync-rmux-bridge-versions.mjs

      - name: Verify rmux-bridge versions match channel-relay
        run: node ./scripts/sync-rmux-bridge-versions.mjs --check

      - name: Verify publishable artifacts
        run: bun run verify:publish

      - name: Publish channel-relay to npm
        working-directory: packages/channel-relay
        run: npm publish --tag ${{ needs.meta.outputs.npm_tag }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: [meta, publish-channel-relay]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag_name="${{ needs.meta.outputs.tag_name }}"
          if gh release view "$tag_name" >/dev/null 2>&1; then
            echo "Release $tag_name already exists, skipping create"
            exit 0
          fi
          TITLE="@ganglion/xacpx-channel-relay v${{ needs.meta.outputs.version }}"
          if [[ "${{ needs.meta.outputs.prerelease }}" == "true" ]]; then
            gh release create "$tag_name" --title "$TITLE" --prerelease --generate-notes
          else
            gh release create "$tag_name" --title "$TITLE" --latest=false --generate-notes
          fi

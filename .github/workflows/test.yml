name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pre-job: classify the PR diff so downstream jobs can gate on path groups.
  # Lives on Ubuntu because it only runs checkout + paths-filter (no build).
  # Skipped on push-to-main since terminal-windows already runs unconditionally
  # there via the `github.event_name == 'push'` clause in its `if`.
  paths:
    name: Detect changed paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
      rmux_bridge: ${{ steps.filter.outputs.rmux_bridge }}
    steps:
      - uses: actions/checkout@v6
        with:
          # dorny/paths-filter diffs against the PR base ref; fetch the full
          # history so that comparison is reliable.
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            windows:
              - 'src/daemon/**'
              - 'src/transport/**'
              - 'src/process/**'
              - 'src/adapters/**'
              - 'src/bridge/**'
              - 'src/cli/**'
              - 'src/config/**'
              - 'tests/unit/daemon/**'
              - 'tests/unit/transport/**'
              - 'tests/unit/process/**'
              - 'tests/unit/adapters/**'
              - 'tests/unit/integration/**'
              - 'tests/smoke/**'
              - 'scripts/smoke-*.mjs'
              - 'package.json'
              - 'bun.lock'
              - 'package-lock.json'
              - '.github/workflows/test.yml'
            rmux_bridge:
              - 'packages/channel-relay/native/rmux-bridge/**'
              - '.github/workflows/test.yml'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        # setup-node restores the npm download cache before this clean install.
        run: npm ci

      - name: Run tests
        run: npm test

      # Real acpx CLI compat smoke against the npm-installed target acpx (no
      # WeChat/credentials): structured argv boundaries, legacy record backfill,
      # queue-owner warm reuse. Gates on the pinned acpx, so drift fails here.
      - name: acpx compat smoke (Linux)
        run: bun run test:compat:acpx

      # Build ALL workspace packages, not just the root. Each package's own
      # tsconfig (e.g. the relay stack's stricter noUncheckedIndexedAccess) is
      # only compiled by its `build:*` script — `bun run build` alone misses
      # them, so package-level type/build errors used to surface only at publish.
      - name: Build (all packages)
        run: bun run build:packages

  rmux-bridge:
    # On PRs, only when the native sidecar (or this workflow) changed.
    # Always runs on push to main so the default branch compiles the bridge.
    needs: paths
    if: github.event_name == 'push' || needs.paths.outputs.rmux_bridge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test
        run: cargo test --manifest-path packages/channel-relay/native/rmux-bridge/Cargo.toml

      - name: cargo check
        run: cargo check --manifest-path packages/channel-relay/native/rmux-bridge/Cargo.toml

  terminal-windows:
    # On PRs, only run when the diff touches the Windows/daemon/transport/
    # adapter surface or shared infra that could break the Windows build.
    # Always runs on push to main so the default branch stays green.
    # `needs.paths.outputs.windows` is job-level-safe; the previous
    # `steps.paths.outputs.windows` form silently failed because the `steps`
    # context does not exist at job-level `if` evaluation.
    needs: paths
    if: github.event_name == 'push' || needs.paths.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Installs node-pty and resolves its Windows prebuilt binary (ConPTY).
      - name: Install dependencies
        run: npm ci

      # Exercises the real Windows junction path used by filtered Claude
      # profiles, including writes to state directories that did not exist yet.
      - name: Claude profile junction smoke (Windows)
        run: bun test tests/unit/adapters/claude-settings-policy.test.ts

      # Uses production Node/libuv and two real processes. The holder is force
      # terminated and the same canonical key must become acquirable again.
      - name: Windows IPC guard exclusivity and crash release
        run: bun test tests/unit/process/ipc-guard.test.ts

      - name: Windows handle-stable process identity and tree termination
        run: bun test tests/unit/process/windows-process-identity.test.ts tests/unit/process/windows-process-tree.test.ts

      - name: Windows daemon stop, fencing, and orphan convergence
        run: bun test tests/unit/daemon/daemon-controller.test.ts tests/unit/transport/orphan-registry.test.ts tests/unit/transport/windows-orphan-reaper.test.ts tests/unit/transport/launch-intent-coordinator.test.ts tests/unit/transport/acpx-queue-owner-launcher.test.ts

      - name: Windows adapter pointer, junction, and GC safety
        run: bun test tests/unit/adapters/adapter-catalog.test.ts tests/unit/adapters/adapter-preinstall.test.ts tests/unit/adapters/adapter-gc.test.ts tests/unit/integration/adapter-orphan-lifecycle.test.ts

      - name: Packaged CLI smoke (Windows)
        shell: pwsh
        run: |
          bun run build
          bun pm pack --dry-run
          node ./dist/cli.js version
          if (-not (Select-String -Quiet -Path ./dist/cli.js -Pattern 'IPC guard is already held')) { throw 'bundled CLI is missing Windows IPC guard runtime' }
          if (-not (Select-String -Quiet -Path ./dist/cli.js -Pattern 'XACPX_PROCESS_REQUEST')) { throw 'bundled CLI is missing Windows process worker runtime' }

      # Real ConPTY under the PRODUCTION runtime (Node) — spawns a live shell with a
      # forward-slash cwd and asserts the byte stream round-trips.
      - name: Terminal ConPTY smoke (Node)
        run: node scripts/smoke-terminal-conpty.mjs

      # Real acpx compat smoke on Windows with Node 24 + npm production install:
      # structured argv launches through the overlay alias (the exact path raw
      # `--agent` cannot take), legacy record backfill, and index repair.
      - name: acpx compat smoke (Windows)
        run: bun run test:compat:acpx

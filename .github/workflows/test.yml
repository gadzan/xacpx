name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Build ALL workspace packages, not just the root. Each package's own
      # tsconfig (e.g. the relay stack's stricter noUncheckedIndexedAccess) is
      # only compiled by its `build:*` script — `bun run build` alone misses
      # them, so package-level type/build errors used to surface only at publish.
      - name: Build (all packages)
        run: bun run build:packages

  terminal-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Installs node-pty and resolves its Windows prebuilt binary (ConPTY).
      - name: Install dependencies
        run: npm ci

      # Exercises the real Windows junction path used by filtered Claude
      # profiles, including writes to state directories that did not exist yet.
      - name: Claude profile junction smoke (Windows)
        run: bun test tests/unit/adapters/claude-settings-policy.test.ts

      # Uses production Node/libuv and two real processes. The holder is force
      # terminated and the same canonical key must become acquirable again.
      - name: Windows IPC guard exclusivity and crash release
        run: bun test tests/unit/process/ipc-guard.test.ts

      # Real ConPTY under the PRODUCTION runtime (Node) — spawns a live shell with a
      # forward-slash cwd and asserts the byte stream round-trips.
      - name: Terminal ConPTY smoke (Node)
        run: node scripts/smoke-terminal-conpty.mjs

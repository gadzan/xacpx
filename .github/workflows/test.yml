name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Build ALL workspace packages, not just the root. Each package's own
      # tsconfig (e.g. the relay stack's stricter noUncheckedIndexedAccess) is
      # only compiled by its `build:*` script — `bun run build` alone misses
      # them, so package-level type/build errors used to surface only at publish.
      - name: Build (all packages)
        run: bun run build:packages

  terminal-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      # Installs node-pty, resolving its Windows prebuilt binary (ConPTY). A failure here
      # means the prebuild didn't resolve for this Node ABI on Windows.
      - name: Install dependencies
        run: npm ci

      # Focused terminal coverage only — NOT the full unit suite (never run on Windows).
      - name: Terminal unit tests
        run: bun test tests/unit/control/terminal-service.test.ts

      # Real ConPTY: spawns a live shell and asserts the byte stream round-trips.
      - name: Terminal PTY smoke (ConPTY)
        run: bun test tests/smoke/terminal-pty-smoke.test.ts

name: Bot reply regressions

on:
  pull_request:
    paths:
      - '.github/workflows/bot-reply-regressions.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/sessions/**'
      - 'src/commands/**'
      - 'src/control/**'
      - 'src/transport/**'
      - 'tests/unit/conversations/conversation-streaming.test.ts'
      - 'tests/unit/sessions/**'
      - 'tests/unit/commands/**'
      - 'tests/unit/control/**'
      - 'tests/unit/transport/**'
      - 'tests/unit/packages/package-metadata.test.ts'

concurrency:
  group: bot-reply-regressions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bot-reply:
    name: Bot reply regressions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Clean dependency install
        run: npm ci
      - name: Typecheck
        run: node ./node_modules/typescript/bin/tsc --noEmit
      - name: Reply streaming and persistence regressions
        run: |
          bun test tests/unit/conversations/conversation-streaming.test.ts tests/unit/control/session-turn-runner.test.ts tests/unit/commands/handlers/session-handler.test.ts tests/unit/transport/acpx-bridge/acpx-bridge-transport.test.ts tests/unit/transport/quota-gated-reply-sink.test.ts tests/unit/packages/package-metadata.test.ts
          bun test tests/unit/sessions/session-service.test.ts --test-name-pattern 'relay-channel|weixin/default session|relay ignores|Conversation ownership'
      - name: Build CLI
        run: bun run build

name: Runtime G10/G12 Matrix

on:
  push:
    branches: [main, "feat/acpx-runtime-engine"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/lint-acpx-imports.mjs
      - run: npm test
      - run: bun scripts/benchmark-runtime-vs-cli.mjs
        # Real G12 data is captured via this harness on each OS; see scripts/benchmark-runtime-vs-cli.mjs for cold/warm/control/TTL/queue scenarios
      - name: Verify Runtime worker lifecycle (G10)
        run: bun test tests/unit/bridge/engine/runtime/runtime-worker-manager.test.ts tests/unit/bridge/engine/runtime/runtime-worker-client.test.ts tests/unit/bridge/engine/runtime/runtime-worker-fence.test.ts --timeout 30000

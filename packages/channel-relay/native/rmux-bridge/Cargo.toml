[package]
name = "xacpx-rmux-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Process-owned RMUX sidecar for xacpx channel-relay (no rmux source patches)."

[[bin]]
name = "xacpx-rmux-bridge"
path = "src/main.rs"

[dependencies]
rmux-ipc = "=0.10.0"
rmux-sdk = "=0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

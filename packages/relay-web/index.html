<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>XACPX HUB</title>
    <!-- Browser chrome colour = page --c-bg. stores/theme.ts rewrites both tags to the
         resolved theme when the user picks one explicitly (relay-theme). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3F4F6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111214" />
    <meta name="description" content="Self-hosted relay dashboard for xacpx — remote-control acpx sessions." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#10151C" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="XACPX" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem('relay-theme');
          if (m !== 'dark' && m !== 'light') {
            m = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.classList.toggle('dark', m === 'dark');
          document.documentElement.style.colorScheme = m;
          var tc = m === 'dark' ? '#111214' : '#F3F4F6';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (el) { el.setAttribute('content', tc); });
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

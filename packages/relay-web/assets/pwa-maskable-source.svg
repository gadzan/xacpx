<svg width="512" height="512" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Maskable PWA icon source: same full-bleed dark tile + xacpx blue/green "X"
       as pwa-source.svg, but the mark is pulled further in so it stays inside
       the maskable safe zone (centered 80% circle) on any platform mask.
       Regenerate via the generate-pwa-icons npm script. -->
  <defs>
    <linearGradient id="xacpxBrandMaskable" x1="8" y1="8" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F9BF5" />
      <stop offset="1" stop-color="#69D689" />
    </linearGradient>
  </defs>
  <rect width="24" height="24" fill="#0E1116" />
  <path d="M8 8 L16 16 M16 8 L8 16" stroke="url(#xacpxBrandMaskable)"
        stroke-width="2.6" stroke-linecap="round" fill="none" />
</svg>

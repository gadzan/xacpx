<svg width="512" height="512" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <!-- PWA icon source: full-bleed dark tile + the xacpx X mark (green ∨ over two blue
       legs), centered inside the maskable safe zone (centered 80% circle), so ONE icon
       works for both "any" and "maskable" purposes. The rect bleeds past the viewBox on
       every side so the rasterizer leaves NO transparent margin (iOS would composite it
       onto white). Kept in sync with src/components/BrandLogo.vue / public/icon.svg.
       Regenerate PNGs in public/ with: bun run generate-pwa-icons. -->
  <rect x="-8" y="-8" width="156" height="156" fill="#0E1116" />
  <g transform="translate(70 70) scale(0.82) translate(-70 -50.5)"
     stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M40 20 L54.5 34.5 A22 22 0 0 0 85.5 34.5 L100 20" stroke="#69D689" />
    <path d="M53 68 L40 81" stroke="#4F9BF5" />
    <path d="M87 68 L100 81" stroke="#4F9BF5" />
  </g>
</svg>
